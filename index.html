<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كتالوج عشق</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css?v=2">

</head>

<body>

<header>

<h1>🌿 كتالوج عشق</h1>
    
<input
type="text"
id="search"
placeholder="ابحث عن منتج...">

<select id="category">

<option value="">جميع الأقسام</option>

</select>

<select id="sort">

<option value="">ترتيب</option>
<option value="name">الاسم</option>
<option value="low">السعر من الأقل</option>
<option value="high">السعر من الأعلى</option>

</select>

</header>

<div id="products"></div>

<div id="productModal" class="modal">

    <div class="modal-content">

        <span class="close">&times;</span>

        <div id="modalBody"></div>

    </div>

</div>
    
<div id="cartBar" class="cart-bar" style="display:none;">

    <span id="cartCount">0 منتجات</span>

    <span id="cartTotal">0 ر.س</span>

</div>
   <div id="cartSheet" class="cart-sheet">

    <div class="sheet-header">

        <h2>🛒 السلة</h2>

        <span id="closeCart">&times;</span>

    </div>

    <div id="cartBody"></div>

</div>
    
 <script src="script.js"></script>
    
</body>

</html>
