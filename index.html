<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eshq</title>

<style>

body{
font-family:Tahoma;
background:#f5f5f5;
margin:0;
padding:20px;
}

h1{
text-align:center;
}

#products{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:12px;
padding:15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:10px;
}

.price{
color:#009966;
font-size:20px;
font-weight:bold;
margin-top:10px;
}

</style>

</head>

<body>

<h1>كاتلوج عشق</h1>

<div id="products"></div>

<script>

const api="https://script.google.com/macros/s/AKfycbzbj-n1Bew61qx5_8N7PCdvZGQf8PKjbIEDqhMRphK5kLyctGz3iIhWa_oN7wG_QG0BaQ/exec";

fetch(api)
.then(r=>r.json())
.then(data=>{

const container=document.getElementById("products");

data.forEach(product=>{

container.innerHTML+=`

<div class="card">

<img src="${product.Image}">

<h3>${product["الاسم"]}</h3>

<div class="price">${product["السعر"]} ر.س</div>

</div>

`;

});

});

</script>

</body>

</html>
